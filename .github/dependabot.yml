version: 2
updates:
  # The actions below are pinned by commit. Without this they are never bumped
  # and the pin goes stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The base image the Tizen CLI is built on.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /.devcontainer
    schedule:
      interval: weekly
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
